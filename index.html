<meta name="description" content="搜尋神隱少年團 Podcast 提到的作品、角色與話題，直接跳到那一集、那一分鐘。">

<meta name="color-scheme" content="light">

<style>
:root{
  --page:#f4efe6; --ink:#1b1a18; --muted:#6e675c; --paper:#ffffff; --line:#e6dfd2;
  --amber:#edb65a; --amber-ink:#1b1a18; --hl:#ffe45c;
  --s-main:#8ccbe6; --s-manda:#f2907f; --s-reader:#6d4c3d; --s-solo:#b8a5e3; --s-special:#f5d77c;
  --shadow:0 2px 0 rgba(0,0,0,.08), 0 10px 24px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#17150f; --ink:#f3eee4; --muted:#b3aa9a; --paper:#fffdf8; --line:#3a352b; --shadow:none; }
}
:root[data-theme="dark"]{ --page:#17150f; --ink:#f3eee4; --muted:#b3aa9a; --paper:#fffdf8; --line:#3a352b; --shadow:none; }
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;padding-bottom:130px}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- 頁首 ---------- */
header{padding:36px 0 6px}
.brand{display:flex;align-items:center;gap:18px}
.logo{flex:none;width:84px;height:84px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:50px;color:#fff;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.brand h1{margin:0;font-weight:900;font-size:clamp(26px,5vw,40px);letter-spacing:.04em;line-height:1.15}
.brand h1 .nw{display:inline-block;white-space:nowrap}
.brand .full{margin:4px 0 0;font-size:13px;color:var(--muted);letter-spacing:.02em}
.tagline{display:inline-block;margin-top:14px;font-weight:700;font-size:15px;padding:0 6px;
  background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%);color:#1b1a18}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tagline{color:var(--ink);background:linear-gradient(transparent 45%,#8a6d00 45%,#8a6d00 92%,transparent 92%)} }

/* ---------- 搜尋列 ---------- */
.search{position:sticky;top:0;z-index:5;background:var(--page);padding:14px 0 10px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid #1b1a18;border-radius:14px;
  padding:4px 6px 4px 16px;box-shadow:4px 4px 0 #1b1a18}
.search-box svg{flex:none;color:#1b1a18}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#1b1a18;font-size:18px;font-weight:500;padding:10px 0;font-family:inherit}
#q::-webkit-search-cancel-button{display:none}
#clear{border:0;background:transparent;color:#6e675c;font-size:24px;cursor:pointer;padding:2px 10px;display:none;line-height:1}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid #1b1a18;background:var(--paper);color:#1b1a18;
  border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid #1b1a18}
.fchip[aria-pressed="true"]{background:#1b1a18;color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted);min-height:26px}
.toolbar b{color:var(--ink)}
.sort{display:flex;gap:4px}
.sort button{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 8px;border-radius:6px;font-family:inherit;font-weight:500}
.sort button[aria-pressed="true"]{color:var(--ink);background:var(--line);font-weight:700}
.alias-note{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- 首頁 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:var(--paper);border:2px solid #1b1a18;border-radius:12px;padding:14px 16px;color:#1b1a18;box-shadow:3px 3px 0 #1b1a18}
.stat b{display:block;font-family:"Bebas Neue","Noto Sans TC",sans-serif;font-size:38px;line-height:1;letter-spacing:.02em}
.stat span{font-size:13px;color:#6e675c;font-weight:500}
.try{font-weight:900;font-size:15px;margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #1b1a18;background:var(--paper);color:#1b1a18;border-radius:8px;padding:4px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.chip:hover{background:var(--hl)}

/* ---------- 單集卡片（IG 拍立得風） ---------- */
.ep{--c:var(--s-main);background:var(--c);border-radius:16px;padding:18px;margin:18px 0;position:relative;box-shadow:var(--shadow)}
.ep[data-s="manda"]{--c:var(--s-manda)} .ep[data-s="reader"]{--c:var(--s-reader)}
.ep[data-s="solo"]{--c:var(--s-solo)} .ep[data-s="special"]{--c:var(--s-special)}
.polaroid{background:var(--paper);color:#1b1a18;border-radius:4px;padding:18px 20px 14px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.ep-label{font-family:"Bebas Neue","Noto Sans TC",sans-serif;font-size:34px;line-height:1;letter-spacing:.03em;margin:0;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ep-label .zh{font-family:"Noto Sans TC",sans-serif;font-weight:900;font-size:24px;letter-spacing:.02em}
.ep-sub{display:inline;font-weight:900;font-size:16.5px;line-height:1.9;margin:0;
  background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
.ep-meta{display:flex;gap:10px;align-items:center;font-size:13px;color:#6e675c;margin-top:8px;font-weight:500}
.count{margin-left:auto;font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.03em;color:#1b1a18;line-height:1}
.count small{font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700;margin-left:2px}
.badge{position:absolute;top:-16px;right:-12px;width:76px;height:76px;transform:rotate(-6deg);pointer-events:none}
.hits{list-style:none;margin:14px 0 0;padding:0;border-top:2px dashed #e6dfd2}
.hit{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0ebe1;align-items:flex-start}
.hit:last-child{border-bottom:0}
.play{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid #1b1a18;background:var(--amber);color:#1b1a18;
  border-radius:8px;padding:2px 10px;font-size:14px;font-weight:900;cursor:pointer;font-variant-numeric:tabular-nums;font-family:inherit;
  box-shadow:2px 2px 0 #1b1a18;margin-top:3px}
.play:active{transform:translate(2px,2px);box-shadow:none}
.play.playing{background:#1b1a18;color:var(--hl)}
.ctx{font-size:15px;word-break:break-word;color:#1b1a18}
.ctx .dim{color:#8a8377}
.spk{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:12.5px;margin-right:4px;white-space:nowrap;vertical-align:-2px}
.spk img{width:22px;height:22px;border-radius:50%;border:1.5px solid #1b1a18;object-fit:cover;background:#fff}
.spk .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid #1b1a18;display:inline-grid;place-items:center;font-size:11px;background:#e6dfd2;line-height:1}
mark{background:linear-gradient(transparent 35%,var(--hl) 35%,var(--hl) 92%,transparent 92%);color:inherit;font-weight:700;padding:0 1px}
.more{border:0;background:transparent;color:#1b1a18;font-size:14px;font-weight:700;cursor:pointer;padding:10px 0 0;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
.handle{display:inline-block;margin-top:12px;background:#1b1a18;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;text-decoration:none}
.ep[data-s="reader"] .handle{background:#fff;color:#1b1a18}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-weight:500}
.empty b{display:block;font-size:20px;color:var(--ink);font-weight:900;margin-bottom:6px}
.loadmore{display:block;margin:24px auto;border:2px solid #1b1a18;background:var(--paper);color:#1b1a18;border-radius:10px;padding:10px 22px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 #1b1a18}

/* ---------- 播放器 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--amber);border-top:3px solid #1b1a18;transform:translateY(110%);transition:transform .25s;color:#1b1a18}
.player.show{transform:none}
.player .wrap{display:flex;flex-direction:column;gap:6px;padding:10px 16px 14px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.p-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-actions{display:flex;gap:6px;flex:none}
.p-actions button,.p-actions a{border:2px solid #1b1a18;background:#fff;color:#1b1a18;border-radius:8px;padding:1px 10px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
audio{width:100%;height:40px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1b1a18;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

.progress{width:min(320px,80%);height:10px;margin:16px auto 8px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.progress i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
.empty small{display:block;font-size:12.5px;color:var(--muted);min-height:1.4em}
.chip small{font-weight:500;color:#8a8377;margin-left:6px;font-size:12px}
.dym{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;color:var(--ink);font-weight:700}
.ask-cta{display:block;margin:0 auto 16px;max-width:560px;background:var(--hl);color:#1b1a18;text-decoration:none;font-size:14px;
  border:2px solid #1b1a18;border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 #1b1a18}

/* ---------- 頁尾 ---------- */
footer{padding:40px 0 20px;text-align:center;font-size:13px;color:var(--muted)}
.social{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.social a{background:#1b1a18;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .social a{background:#fff;color:#1b1a18} }
:root[data-theme="dark"] .social a{background:#fff;color:#1b1a18}

/* 深色模式：黑色描邊改成琥珀色，避免在深底上消失 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .search-box{box-shadow:4px 4px 0 var(--amber)}
  :root:not([data-theme="light"]) .stat, :root:not([data-theme="light"]) .loadmore{box-shadow:3px 3px 0 var(--amber)}
  :root:not([data-theme="light"]) .fchip[aria-pressed="true"]{background:var(--amber);color:#1b1a18}
}
:root[data-theme="dark"] .search-box{box-shadow:4px 4px 0 var(--amber)}
:root[data-theme="dark"] .stat, :root[data-theme="dark"] .loadmore{box-shadow:3px 3px 0 var(--amber)}
:root[data-theme="dark"] .fchip[aria-pressed="true"]{background:var(--amber);color:#1b1a18}

@media (max-width:560px){
  header{padding-top:22px}
  .logo{width:64px;height:64px;font-size:38px}
  .ep{padding:12px;border-radius:12px}
  .polaroid{padding:14px 14px 12px}
  .ep-label{font-size:28px}
  .ep-label .zh{font-size:20px}
  .badge{width:58px;height:58px;top:-12px;right:-8px}
  .stat b{font-size:30px}
  .stats{gap:8px}
  .stat{padding:10px 12px}
  .hit{flex-direction:column;gap:6px}
  .play{margin-top:0}
}

/* ---------- 動態背景：緩慢飄動的漫畫網點 ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg .tone{position:absolute;inset:-60px;
  background-image:radial-gradient(rgba(27,26,24,.075) 1.6px,transparent 1.8px);background-size:22px 22px;
  animation:tone 28s linear infinite;will-change:transform}
@keyframes tone{to{transform:translate(22px,22px)}}
@media (max-width:760px){ .bg .tone{opacity:.8} }
@media (prefers-reduced-motion: reduce){ .bg .tone{animation:none} }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="tone"></div></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">隱</div>
      <div>
        <h1><span class="nw">神隱少年團</span><span class="nw">Podcast關鍵字搜尋</span></h1>
        <p class="full">動畫漫畫遊戲咖啡閒聊次文化電台暨物語廚俱樂部</p>
      </div>
    </div>
    <span class="tagline">超高校級宅力檢查：輸入作品，直接跳到那一集、那一分鐘</span>
  </header>

  <div class="search">
    <label class="search-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="芙莉蓮、鏈鋸人、宮崎駿…" autocomplete="off" enterkeyhint="search" aria-label="搜尋逐字稿">
      <button id="clear" type="button" aria-label="清除">×</button>
    </label>
    <div class="filters" role="group" aria-label="系列">
      <button class="fchip" data-f="all" aria-pressed="true">全部</button>
      <button class="fchip" data-f="main" aria-pressed="false"><i style="background:var(--s-main)"></i>一般集數</button>
      <button class="fchip" data-f="manda" aria-pressed="false"><i style="background:var(--s-manda)"></i>漫打旋風</button>
      <button class="fchip" data-f="reader" aria-pressed="false"><i style="background:var(--s-reader)"></i>隱式讀者</button>
      <button class="fchip" data-f="solo" aria-pressed="false"><i style="background:var(--s-solo)"></i>單口</button>
      <button class="fchip" data-f="special" aria-pressed="false"><i style="background:var(--s-special)"></i>特別篇</button>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <span id="summary"></span>
      <div class="sort" role="group" aria-label="排序">
        <button type="button" data-sort="count" aria-pressed="true">提及最多</button>
        <button type="button" data-sort="new" aria-pressed="false">最新</button>
        <button type="button" data-sort="old" aria-pressed="false">最舊</button>
      </div>
    </div>
    <div class="alias-note" id="alias-note"></div>
  </div>

  <main id="main"><div class="empty"><b>宅力檢查中…</b>正在載入 200 多集逐字稿
    <div class="progress" aria-hidden="true"><i id="bar"></i></div><small id="ptext"></small></div></main>

  <footer>
    <a class="ask-cta" id="ask-cta" href="https://spiritboyaway.github.io/ask-show/" hidden>找不到想要的？試試 <b>問問節目</b>：用聊天的方式問我們聊過什麼 →</a>
    <div class="social">
      <a href="https://www.instagram.com/spiritboyaway_podcast/" target="_blank" rel="noopener">@spiritboyaway_podcast</a>
      <a href="https://linktr.ee/spiritboyaway" target="_blank" rel="noopener">收聽連結</a>
    </div>
    <div id="footnote"></div>
  </footer>
</div>

<div class="player" id="player" aria-live="polite">
  <div class="wrap">
    <div class="p-top">
      <span class="p-title" id="p-title"></span>
      <div class="p-actions">
        <button type="button" id="p-back" title="倒退 15 秒">−15s</button>
        <button type="button" id="p-share" title="複製這個時間點的連結">分享此刻</button>
        <a id="p-link" target="_blank" rel="noopener" hidden>單集頁</a>
      </div>
    </div>
    <audio id="audio" controls controlsList="nodownload" disableRemotePlayback preload="none" oncontextmenu="return false"></audio>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const PAGE = 30, SHOW_HITS = 3, MERGE_SEC = 25, LEAD_SEC = 3;

  // ---- 搜尋關鍵字統計（GoatCounter，免費、不追蹤個人；只記搜尋詞，不記瀏覽人次）：申請後把代號填在這裡，例如 "spiritboyaway"；空白就不統計 ----
  const GOATCOUNTER = "";
  if (GOATCOUNTER){
    const s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
    // 不記錄瀏覽人次，只記錄搜尋關鍵字
    s.dataset.goatcounterSettings = JSON.stringify({ no_onload: true });
    document.head.appendChild(s);
  }
  const sent = new Set(); let trackTimer;
  function track(q, n){
    if (!GOATCOUNTER) return;
    clearTimeout(trackTimer);
    q = q.trim();
    if (q.length < 2) return;
    // 打字停下 2 秒才算一次搜尋，同一個詞同一次瀏覽只記一次
    trackTimer = setTimeout(() => {
      if (sent.has(q) || !window.goatcounter || !window.goatcounter.count) return;
      sent.add(q);
      window.goatcounter.count({ path: (n ? "搜尋/" : "搜尋（找不到）/") + q, title: q, event: true });
    }, 2000);
  }

  // ---- 「問問節目」上線後自動顯示入口 ----
  fetch("/ask-show/", { method: "HEAD" }).then(r => { if (r.ok) document.querySelector("#ask-cta").hidden = false; }).catch(() => {});
  const $ = s => document.querySelector(s);
  const qEl = $("#q"), mainEl = $("#main"), audio = $("#audio");
  let DATA = null, EPS = [], ALIAS = new Map(), sortMode = "count", filter = "all", lastResults = [], shown = PAGE, currentEp = null;

  function norm(s){ let out = "";
    for (let i = 0; i < s.length; i++){ let c = s.charCodeAt(i);
      if (c >= 0xFF01 && c <= 0xFF5E) c -= 0xFEE0; else if (c === 0x3000) c = 32;
      out += (c < 0xD800 || c > 0xDFFF) ? String.fromCharCode(c).toLowerCase().charAt(0) : s[i]; }
    return out; }
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = sec => { sec = Math.max(0, sec|0); const h = sec/3600|0, m = (sec%3600)/60|0, s = sec%60;
    return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`; };

  // ---- 系列與標題拆解（對應 IG 貼文的寫法） ----
  function describe(ep){
    const t = ep.title, id = ep.id;
    if (t.startsWith("【漫打旋風】")) return { s:"manda", label:`EP.${ep.num ?? ""}`, zh:"漫打旋風", sub:t.replace("【漫打旋風】","").trim(), badge:"漫" };
    if (id.startsWith("reader")) { const n = id.replace("reader",""); return { s:"reader", label:n, zh:"隱式讀者", sub:t.replace(/^隱式讀者\s*\d+\s*[：:]\s*/,"") }; }
    if (id.startsWith("sp")) return { s:"solo", label:`SP${id.slice(2)}`, zh:"單口", sub:t.replace(/^單口SP\d+\s*[：:]\s*/,"") };
    if (id.startsWith("ep")) { const part = id.split("-")[1]; return { s:"main", label:`EPISODE ${ep.num}${part ? "-" + part : ""}`, zh:"", sub:t.replace(/^EP\.?\s*\d+(-\d+)?\s*[：:\s]\s*/i,"") || t }; }
    return { s:"special", label:"", zh:"特別篇", sub:t };
  }

  // ---- 載入逐字稿：有快取就直接用；沒有就下載並顯示進度 ----
  const CACHE = "podcast-search-data";
  async function loadData(){
    let ver = null;
    try { ver = await fetch("data-version.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch (e) {}
    const key = "data.json?v=" + (ver ? ver.v : "nov");
    let cache = null;
    try { cache = await caches.open(CACHE); } catch (e) {}
    if (cache && ver){
      try { const hit = await cache.match(key); if (hit) return await hit.json(); } catch (e) {}
    }
    const res = await fetch(key);
    if (!res.ok) throw new Error(res.status);
    let text;
    const total = ver ? ver.bytes : 0;
    if (res.body && total){
      const reader = res.body.getReader(), chunks = []; let got = 0;
      for (;;){ const { done, value } = await reader.read(); if (done) break;
        chunks.push(value); got += value.length; showProgress(got, total); }
      const all = new Uint8Array(got); let o = 0; for (const c of chunks){ all.set(c, o); o += c.length; }
      text = new TextDecoder().decode(all);
    } else text = await res.text();
    if (cache && ver){
      try {
        await cache.put(key, new Response(text, { headers: { "Content-Type": "application/json" } }));
        for (const k of await cache.keys()) if (!k.url.endsWith(key)) cache.delete(k);
      } catch (e) {}
    }
    return JSON.parse(text);
  }
  function showProgress(got, total){
    const p = Math.min(100, Math.round(got / total * 100)), bar = $("#bar"), pt = $("#ptext");
    if (bar) bar.style.width = p + "%";
    if (pt) pt.textContent = `${p}%（${(got/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MB）・下次打開就不用再等了`;
  }

  loadData().then(d => {
    DATA = d;
    EPS = d.episodes.map(ep => { const offs = []; let joined = "";
      ep.x.forEach(t => { offs.push(joined.length); joined += t + " "; });
      return Object.assign(ep, { offs, joined, njoined: norm(joined), info: describe(ep) }); });
    for (const [k, list] of Object.entries(d.aliases || {})){
      const group = [k, ...list].map(norm);
      group.forEach(w => ALIAS.set(w, { name: k, words: group, display: [k, ...list] })); }
    $("#footnote").textContent = `收錄 ${EPS.length} 集逐字稿・更新於 ${d.built}・逐字稿可能有錯字，歡迎到 IG 告訴我們`;
    readUrl();
  }).catch(err => { mainEl.innerHTML = `<div class="empty"><b>讀不到逐字稿資料</b>${esc(String(err.message||err))}</div>`; });

  function expand(term){ const t = norm(term), a = ALIAS.get(t);
    return a ? { words: a.words, alias: a.name, display: a.display } : { words: [t] }; }
  const RE_CACHE = new Map();
  function toRe(w){ if (!RE_CACHE.has(w)){
      const chars = [...w.replace(/\s+/g, "")].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      RE_CACHE.set(w, chars.length ? new RegExp(chars.join(" ?"), "g") : null); }
    return RE_CACHE.get(w); }
  function hasAny(hay, words){ return words.some(w => { const re = toRe(w); if (!re) return false; re.lastIndex = 0; return re.test(hay); }); }
  function findAll(hay, words){ const pos = [];
    for (const w of words){ const re = toRe(w); if (!re) continue; re.lastIndex = 0; let m;
      while ((m = re.exec(hay))) { pos.push([m.index, m[0].length]); re.lastIndex = m.index + 1; } }
    pos.sort((a,b) => a[0]-b[0] || b[1]-a[1]);
    const out = []; let end = -1; for (const x of pos){ if (x[0] >= end){ out.push(x); end = x[0] + x[1]; } } return out; }
  function segAt(offs, pos){ let lo = 0, hi = offs.length - 1;
    while (lo < hi){ const mid = (lo + hi + 1) >> 1; if (offs[mid] <= pos) lo = mid; else hi = mid - 1; } return lo; }

  function search(q){
    const terms = q.trim().split(/\s+/).filter(Boolean).map(expand);
    if (!terms.length) return null;
    const [first, ...rest] = terms, results = [];
    for (const ep of EPS){
      if (filter !== "all" && ep.info.s !== filter) continue;
      if (!rest.every(t => hasAny(ep.njoined, t.words))) continue;
      const pos = findAll(ep.njoined, first.words); if (!pos.length) continue;
      const moments = []; let lastSeg = -1;
      for (const [p] of pos){ const si = segAt(ep.offs, p);
        if (si === lastSeg) { moments[moments.length-1].n++; continue; }
        const prev = moments[moments.length-1];
        if (prev && ep.t[si] - ep.t[prev.seg] < MERGE_SEC && si - prev.last <= 3){ prev.n++; prev.last = si; lastSeg = si; continue; }
        moments.push({ seg: si, last: si, n: 1 }); lastSeg = si; }
      results.push({ ep, moments, count: pos.length });
    }
    return { terms, results };
  }
  function highlight(text, terms){ const nt = norm(text), ranges = [];
    terms.forEach(t => ranges.push(...findAll(nt, t.words))); ranges.sort((a,b) => a[0]-b[0]);
    let out = "", i = 0;
    for (const [p, len] of ranges){ if (p < i) continue; out += esc(text.slice(i, p)) + "<mark>" + esc(text.slice(p, p+len)) + "</mark>"; i = p + len; }
    return out + esc(text.slice(i)); }
  // 說話者（step6 辨識）：這一句是誰說的 → 小頭像
  const AVATAR = { "二百五": "img/host-250.webp", "鳳梨": "img/host-pineapple.webp" };
  function speaker(ep, si){
    if (!ep.sp || !ep.sr) return "";
    let who = -1;
    for (const [start, k] of ep.sr){ if (start > si) break; who = k; }
    if (who < 0) return "";
    const name = ep.sp[who];
    return AVATAR[name] ? `<span class="spk"><img src="${AVATAR[name]}" alt="">${esc(name)}：</span>`
                        : `<span class="spk"><span class="dot">客</span>${esc(name)}：</span>`;
  }
  function context(ep, m, terms){
    const a = Math.max(0, m.seg - 1), b = Math.min(ep.x.length - 1, m.last + 1);
    let before = a < m.seg ? ep.x[a] : "", after = b > m.last ? ep.x[b] : "";
    if (before.length > 40) before = "…" + before.slice(-40); if (after.length > 40) after = after.slice(0, 40) + "…";
    return `<span class="dim">${highlight(before, terms)}</span> ${highlight(ep.x.slice(m.seg, m.last + 1).join(" "), terms)} <span class="dim">${highlight(after, terms)}</span>`; }

  function renderHome(){
    $("#toolbar").hidden = true; $("#alias-note").textContent = "";
    const hours = EPS.reduce((s, e) => s + (e.t[e.t.length-1] || 0), 0) / 3600;
    const chars = EPS.reduce((s, e) => s + e.joined.length, 0);
    const top = (DATA.top || []).slice(0, 20);
    mainEl.innerHTML = `
      <div class="stats">
        <div class="stat"><b>${EPS.length}</b><span>集節目</span></div>
        <div class="stat"><b>${Math.round(hours)}</b><span>小時</span></div>
        <div class="stat"><b>${Math.round(chars/10000)}萬</b><span>字逐字稿</span></div>
      </div>
      <div class="try">熱門話題：節目最常聊到的作品</div>
      <div class="chips">${top.map(([name, eps]) => `<button class="chip" data-q="${esc(name)}">${esc(name)}<small>${eps} 集</small></button>`).join("")}</div>`;
  }

  // ---- 找不到時：你是不是要找… ----
  let SUG = null, sugLoading = null;
  function loadSuggest(){
    if (SUG || sugLoading) return sugLoading;
    sugLoading = fetch("suggest.json").then(r => r.ok ? r.json() : null).then(d => { SUG = d; return d; }).catch(() => null);
    return sugLoading;
  }
  function suggestFor(q){
    if (!SUG) return [];
    const out = [], seen = new Set(), add = w => { if (w && !seen.has(w) && w !== q){ seen.add(w); out.push(w); } };
    const fixed = Object.entries(SUG.fix || {}).find(([w]) => q.includes(w));
    if (fixed) add(q.replace(fixed[0], fixed[1]));
    const py = c => SUG.py[c] || c.toLowerCase();
    const qp = [...q.replace(/\s+/g, "")].map(py);
    if (qp.length >= 2){
      const scored = [];
      for (const t of SUG.terms){
        const tp = [...t].map(py);
        // 讀音整段相同，或者包含在作品名裡（打了一部分）
        for (let i = 0; i + qp.length <= tp.length; i++){
          let diff = 0;
          for (let j = 0; j < qp.length && diff <= 1; j++) if (tp[i+j] !== qp[j]) diff++;
          if (diff === 0 || (diff === 1 && qp.length >= 3)){ scored.push([diff, tp.length - qp.length, t]); break; }
        }
      }
      scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      scored.slice(0, 4).forEach(s => add(s[2]));
    }
    return out.slice(0, 4);
  }
  function renderNoResult(q){
    const base = `<div class="empty"><b>看不清楚嗎？</b>找不到「${esc(q)}」，換個簡稱或只打幾個字再測一次${filter !== "all" ? "，或把系列切回「全部」" : ""}。<div id="dym"></div></div>`;
    mainEl.innerHTML = base;
    loadSuggest().then(() => {
      if (qEl.value !== q) return;
      const s = suggestFor(q.trim()), box = $("#dym");
      if (box && s.length) box.innerHTML = `<div class="dym">你是不是要找：${s.map(w => `<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
    });
  }

  function render(){
    const q = qEl.value; $("#clear").style.display = q ? "block" : "none";
    if (!DATA) return;
    const r = search(q);
    if (!r){ renderHome(); return; }
    let list = r.results.slice();
    if (sortMode === "count") list.sort((a,b) => b.count - a.count || b.ep.date.localeCompare(a.ep.date));
    else if (sortMode === "new") list.sort((a,b) => b.ep.date.localeCompare(a.ep.date));
    else list.sort((a,b) => a.ep.date.localeCompare(b.ep.date));
    lastResults = list;
    const total = list.reduce((s, x) => s + x.count, 0);
    $("#toolbar").hidden = false;
    $("#summary").innerHTML = list.length ? `<b>${list.length}</b> 集提到，共 <b>${total}</b> 次` : "";
    const aliasT = r.terms.filter(t => t.alias);
    $("#alias-note").textContent = aliasT.length ? "也一起搜尋：" + aliasT.map(t => t.display.join("、")).join("；") : "";
    track(q, list.length);
    if (!list.length){ renderNoResult(q); return; }
    mainEl.innerHTML = list.slice(0, shown).map((res, idx) => card(res, idx, r.terms)).join("") +
      (list.length > shown ? `<button class="loadmore" id="loadmore">再看 ${Math.min(PAGE, list.length - shown)} 集（共 ${list.length} 集）</button>` : "");
  }

  function card(res, idx, terms){
    const { ep, moments } = res, info = ep.info;
    const items = moments.map((m, i) => `
      <li class="hit" ${i >= SHOW_HITS ? "hidden" : ""}>
        <button class="play" data-ep="${idx}" data-t="${ep.t[m.seg]}" aria-label="從 ${fmt(ep.t[m.seg])} 開始播放">
          <svg width="9" height="11" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z" fill="currentColor"/></svg>${ep.approx ? "約" : ""}${fmt(ep.t[m.seg])}
        </button>
        <div class="ctx">${speaker(ep, m.seg)}${context(ep, m, terms)}</div>
      </li>`).join("");
    return `<article class="ep" data-s="${info.s}">
      ${info.badge ? `<img class="badge" src="manda-badge.png" alt="漫打旋風" width="76" height="76">` : ""}
      <div class="polaroid">
        <h2 class="ep-label">${info.label ? `<span>${esc(info.label)}</span>` : ""}${info.zh ? `<span class="zh">${esc(info.zh)}</span>` : ""}</h2>
        <p class="ep-sub">${esc(info.sub)}</p>
        <div class="ep-meta"><span>${ep.date}</span>${ep.approx ? "<span>・時間為估算</span>" : ""}<span class="count">${res.count}<small>次</small></span></div>
        <ul class="hits">${items}</ul>
        ${moments.length > SHOW_HITS ? `<button class="more">再看 ${moments.length - SHOW_HITS} 段</button>` : ""}
      </div>
    </article>`;
  }

  function playAt(ep, t){
    currentEp = ep; $("#player").classList.add("show"); $("#p-title").textContent = ep.title;
    const link = $("#p-link"); link.hidden = !ep.link; if (ep.link) link.href = ep.link;
    const start = Math.max(0, t - LEAD_SEC), go = () => { audio.currentTime = start; audio.play().catch(() => {}); };
    if (audio.dataset.ep !== ep.id){ audio.dataset.ep = ep.id; audio.src = ep.audio; audio.preload = "auto";
      audio.addEventListener("loadedmetadata", go, { once: true }); audio.load(); } else go();
  }
  function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

  function readUrl(){
    const p = new URLSearchParams(location.search), hash = new URLSearchParams(location.hash.slice(1));
    qEl.value = hash.get("q") || p.get("q") || ""; shown = PAGE; render();
    const epId = p.get("ep"), t = +p.get("t") || 0;
    if (epId){ const ep = EPS.find(e => e.id === epId);
      if (ep){ $("#player").classList.add("show"); $("#p-title").textContent = ep.title + "（按播放鍵開始）";
        currentEp = ep; audio.dataset.ep = ep.id; audio.src = ep.audio;
        audio.addEventListener("loadedmetadata", () => { audio.currentTime = t; }, { once: true }); audio.preload = "metadata"; audio.load(); } }
  }
  let timer;
  qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { shown = PAGE; render();
    const q = qEl.value.trim(); history.replaceState(null, "", location.pathname + location.search + (q ? "#q=" + encodeURIComponent(q) : "")); }, 200); });
  window.addEventListener("hashchange", readUrl);
  $("#clear").addEventListener("click", () => { qEl.value = ""; qEl.dispatchEvent(new Event("input")); qEl.focus(); });
  document.querySelectorAll(".sort button").forEach(b => b.addEventListener("click", () => {
    sortMode = b.dataset.sort; shown = PAGE; document.querySelectorAll(".sort button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }));
  document.querySelectorAll(".fchip").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f; shown = PAGE; document.querySelectorAll(".fchip").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }));
  mainEl.addEventListener("click", e => {
    const play = e.target.closest(".play");
    if (play){ document.querySelectorAll(".play.playing").forEach(x => x.classList.remove("playing")); play.classList.add("playing");
      playAt(lastResults[+play.dataset.ep].ep, +play.dataset.t); return; }
    const more = e.target.closest(".more");
    if (more){ more.closest(".ep").querySelectorAll(".hit[hidden]").forEach(li => li.hidden = false); more.remove(); return; }
    const chip = e.target.closest(".chip");
    if (chip){ qEl.value = chip.dataset.q; qEl.dispatchEvent(new Event("input")); return; }
    if (e.target.id === "loadmore"){ shown += PAGE; render(); }
  });
  $("#p-back").addEventListener("click", () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  $("#p-share").addEventListener("click", () => { if (!currentEp) return; const q = qEl.value.trim();
    const url = `${location.origin}${location.pathname}?ep=${encodeURIComponent(currentEp.id)}&t=${Math.floor(audio.currentTime)}${q ? "#q=" + encodeURIComponent(q) : ""}`;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast(`已複製 ${fmt(audio.currentTime)} 的連結`), () => prompt("複製這個連結：", url)); });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); } });
})();
</script>
</body>
</html>
